# Strips the "/api" prefix before forwarding to each service, so
# /api/users/5  ->  user-service receives  /users/5
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shoplite-ingress
  namespace: shoplite
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: shoplite.local
      http:
        paths:
          - path: /api/(users.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port: { number: 8000 }
          - path: /api/(products.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: catalog-service
                port: { number: 8000 }
          - path: /api/(orders.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: order-service
                port: { number: 8000 }
          - path: /api/(notifications.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: notification-service
                port: { number: 8000 }
