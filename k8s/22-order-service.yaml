apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shoplite
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: shoplite/order-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: shoplite-secrets, key: ORDER_DATABASE_URL } }
            - name: RABBITMQ_URL
              valueFrom: { secretKeyRef: { name: shoplite-secrets, key: RABBITMQ_URL } }
            - name: USER_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: shoplite-config, key: USER_SERVICE_URL } }
            - name: CATALOG_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: shoplite-config, key: CATALOG_SERVICE_URL } }
            - name: HTTP_TIMEOUT_SECONDS
              valueFrom: { configMapKeyRef: { name: shoplite-config, key: HTTP_TIMEOUT_SECONDS } }
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: shoplite-config, key: LOG_LEVEL } }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shoplite
spec:
  selector: { app: order-service }
  ports:
    - port: 8000
      targetPort: 8000
